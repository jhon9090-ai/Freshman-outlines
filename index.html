
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intelligent Outlines</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

    <style>
      :root {
        --color-primary-accent: #0ea5e9;
        --color-success: #22c55e;
        --color-error: #ef4444;
        --color-background: #020617;
        --color-text-light: #ffffff;
        --color-text-body: #cbd5e1;
        --color-text-muted: #94a3b8;
        --color-border: rgba(255, 255, 255, 0.1);
        --color-panel-bg: rgba(15, 23, 42, 0.4);
      }

      body {
        background-color: var(--color-background);
        color: var(--color-text-body);
        font-family: 'Sora', sans-serif;
        overflow: hidden;
        overflow-x: hidden;
        background-image:
          radial-gradient(ellipse 80% 80% at 50% 50%, rgba(14, 165, 233, 0.15), transparent),
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 3rem 3rem, 3rem 3rem;
      }

      h1, h2, h3, h4, h5, h6, .font-editorial {
        font-weight: 700;
        color: var(--color-text-light);
      }
      p, li, span, div, button, label, input, select, option, summary {
        font-weight: 400;
        color: var(--color-text-body);
      }

      .glass-panel {
        background-color: var(--color-panel-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--color-border);
        border-radius: 1rem; /* rounded-2xl */
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), 
                    inset 0 0 1px 1px rgba(255, 255, 255, 0.03);
      }
      
      .solid-card-panel {
          background-color: #0f172a; /* slate-900 */
          border: 1px solid var(--color-border);
          border-radius: 1rem; /* rounded-2xl */
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(14, 165, 233, 0.3); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(14, 165, 233, 0.5); }
      
      /* Interaction Language */
      button, a, label, summary {
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      button:active, a:active, label:active {
        transform: scale(0.97);
      }

      /* Keyframe Animations */
      @keyframes quickFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes quickFadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      @keyframes scaleOut {
        from { opacity: 1; transform: scale(1); }
        to { opacity: 0; transform: scale(0.95); }
      }
      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.5); }
        70% { opacity: 1; transform: scale(1.1); }
        100% { transform: scale(1); }
      }
      
      .view-container-animate { animation: quickFadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
      .modal-backdrop-animate { animation: fadeIn 0.3s ease-out forwards; }
      .modal-panel-animate { animation: scaleIn 0.3s ease-out forwards; }
      .pop-in-animate { animation: popIn 0.3s ease-out forwards; }
      .animate-fade-out { animation: fadeOut 0.3s ease-out forwards; }
      .animate-scale-out { animation: scaleOut 0.3s ease-out forwards; }
      .animate-quickFadeIn { animation: quickFadeIn 0.3s ease-out forwards; }
      .animate-quickFadeOut { animation: quickFadeOut 0.3s ease-out forwards; }


      /* General Accordion styles for smooth open/close */
      .accordion-content {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.3s ease-out;
      }
      details[open] > .accordion-content,
      .accordion-content.expanded {
        grid-template-rows: 1fr;
      }
      .accordion-content-inner {
        overflow: hidden;
      }
      details[open] .accordion-content-inner {
        animation: fadeIn 0.4s ease-out;
      }
      details > summary {
          list-style: none; /* remove triangle marker */
      }
      details > summary::-webkit-details-marker {
          display: none; /* remove triangle marker for webkit */
      }
      
      /* Dashboard Folder Accordion */
      details.folder-accordion[open] > .folder-accordion-content {
        grid-template-rows: 1fr;
      }
      .folder-accordion-content {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.3s ease-out;
      }
      .folder-accordion-content-inner {
          overflow: hidden;
          animation: fadeIn 0.5s ease-out;
      }

      /* Settings Panel Accordion Alignment */
      .settings-accordion summary {
          display: flex;
          justify-content: space-between;
          align-items: center;
          cursor: pointer;
          list-style: none; /* remove triangle */
      }
      .settings-accordion summary::-webkit-details-marker {
          display: none; /* remove triangle for webkit */
      }
      .settings-accordion .summary-title {
          display: flex;
          align-items: center;
          gap: 0.75rem;
          font-weight: 600;
          color: var(--color-text-light);
      }
      .settings-accordion .summary-chevron {
          transition: transform 0.3s ease-out;
      }
      .settings-accordion[open] .summary-chevron {
          transform: rotate(90deg);
      }
      
      /* New "Fancy" Tab Animations */
      .view-container {
        position: absolute;
        width: 100%;
        height: 100%;
        transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.5s ease-in-out, scale 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        will-change: transform, opacity, scale;
      }
      .view-is-active {
        transform: translateX(0) scale(1);
        opacity: 1;
        z-index: 10;
        pointer-events: auto;
      }
      .view-is-before {
        transform: translateX(-40%) scale(0.9);
        opacity: 0;
        pointer-events: none;
      }
      .view-is-after {
        transform: translateX(40%) scale(0.9);
        opacity: 0;
        pointer-events: none;
      }
    </style>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
